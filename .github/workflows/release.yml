name: release

on:
  workflow_dispatch:      # 手动触发: 构建三平台 wheel + sdist(不发布)
  push:
    tags: ["v*"]          # 打 v* tag: 构建并发布到 PyPI

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64 / Windows x86_64 / macOS x86_64 + arm64
        # (架构跟随 runner: macos-13=intel, macos-14=apple silicon)
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # cp310-cp313 的平台 wheel(跳过 musllinux), 配置见 pyproject.toml
      - name: Build platform wheels (cibuildwheel)
        uses: pypa/cibuildwheel@v2.22.0
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Trusted Publishing 需要
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # 二选一:
          #   1) 推荐 Trusted Publishing(PyPI 侧配置, 免 token):
          #      https://docs.pypi.org/trusted-publishers/
          #   2) 在仓库 Settings -> Secrets 添加 PYPI_API_TOKEN 后使用
          password: ${{ secrets.PYPI_API_TOKEN }}
